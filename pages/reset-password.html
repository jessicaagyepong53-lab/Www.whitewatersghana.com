<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://kit.fontawesome.com/ac7beb975d.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>

  <section class="auth-section">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1>New Password</h1>
        <p>Enter your new password below</p>
      </div>

      <form id="resetForm">

        <div class="form-group">
  <label for="new-password">
    <i class="fa-solid fa-lock"></i> New Password
  </label>
  <div style="position: relative;">
    <input type="password" id="new-password" placeholder="••••••••••" name="new-password" required>
    <i class="fa-regular fa-eye toggle-password" data-target="new-password" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color: gray;"></i>
  </div>
  <div class="password-rules">
    <p id="rule-length" class="rule">✗ At least 8 characters</p>
    <p id="rule-upper" class="rule">✗ At least one uppercase letter</p>
    <p id="rule-number" class="rule">✗ At least one number</p>
  </div>
</div>

<div class="form-group">
  <label for="confirm-new-password">
    <i class="fa-solid fa-lock"></i> Confirm New Password
  </label>
  <div style="position: relative;">
    <input type="password" id="confirm-new-password" placeholder="••••••••••" name="confirm-new-password" required>
    <i class="fa-regular fa-eye toggle-password" data-target="confirm-new-password" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color: gray;"></i>
  </div>
  <p id="password-match" style="font-size: 13px; margin-top: 6px;"></p>
</div>

        <p class="input-error-msg" id="err-reset"></p>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-lock"></i> Reset Password
        </button>

      </form>

    </div>
  </section>

  <script src="../src/script.js"></script>
</body>
</html>
