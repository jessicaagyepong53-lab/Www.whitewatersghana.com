<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Forgot Password</title>
  <script src="https://kit.fontawesome.com/ac7beb975d.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>
  <section class="auth-section">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1>Staff Password Reset</h1>
        <p>Verify your security question to continue</p>
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">
            <i class="fa-regular fa-envelope"></i> Staff Login ID
          </label>
          <input type="email" id="email" placeholder="approved staff login" name="email" required>
          <p class="input-error-msg" id="err-email">Please enter your staff login ID</p>
        </div>

        <div class="form-group" id="security-question-group" style="display:none;">
          <label for="security-question-select">
            <i class="fa-solid fa-shield"></i> Select Your Security Question
          </label>
          <select id="security-question-select" name="security-question">
            <option value="">-- Choose your security question --</option>
            <option value="mothers-maiden-name">What is your mother's maiden name?</option>
            <option value="first-pet">What was the name of your first pet?</option>
            <option value="primary-school">What primary school did you attend?</option>
            <option value="childhood-nickname">What was your childhood nickname?</option>
            <option value="first-car">What was the model of your first car?</option>
          </select>
          <p class="input-error-msg" id="err-question">Please select your security question</p>

          <label for="security-answer" style="margin-top: 12px;">
            <i class="fa-solid fa-key"></i> Your Answer
          </label>
          <input type="text" id="security-answer" placeholder="Your answer" name="security-answer">
          <p class="input-error-msg" id="err-answer">Please enter your security answer</p>
        </div>

        <p class="input-error-msg" id="err-forgot"></p>

        <button type="submit" class="submit-btn" id="forgot-btn">
          <i class="fa-solid fa-arrow-right"></i> Continue
        </button>

        <p class="auth-switch">
          Remembered your password? <a href="staff-login.html">Back to Staff Login</a>
        </p>
      </form>
    </div>
  </section>

  <script src="../src/script.js"></script>
</body>
</html>
